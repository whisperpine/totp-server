# The default stages for hooks that don't have stages configured.
default_stages = ["pre-commit"]

# This changes the behaviour when running "prek install".
# All hook types will be installed as configured here.
default_install_hook_types = [
  "pre-commit",
  "commit-msg",
  "post-commit",
  "pre-push",
]

# Concurrency convention:
# File-modifying hooks omit `priority`, so they keep their implicit priority
# (their config index) and run sequentially, each exclusively. All read-only
# hooks set `priority = 100`, so they run concurrently after the writers.
# Keep the total number of hooks in this file below 100 so implicit priorities
# never collide with the reader band.

# All prek built-in hooks:
# https://prek.j178.dev/builtin/
[[repos]]
repo = "builtin"
hooks = [
  # Trims trailing whitespace.
  { id = "trailing-whitespace" },
  # Ensures that a file is either empty, or ends with one newline.
  { id = "end-of-file-fixer" },
  # Checks for the existence of private keys.
  { id = "detect-private-key", priority = 100 },
  # Prevents giant files from being committed.
  { id = "check-added-large-files", args = ["--maxkb=256"], priority = 100 },
  # Checks for files that contain merge conflict strings.
  { id = "check-merge-conflict", priority = 100 },
  # Replaces or checks mixed line endings.
  { id = "mixed-line-ending", args = ["--fix=lf"] },
]

# Local hooks inside this repository.
[[repos]]
repo = "local"

[[repos.hooks]]
id = "typos"
name = "check misspelling by typos"
language = "system"
entry = "typos --hidden --exclude .git --format brief"
pass_filenames = false
priority = 100

[[repos.hooks]]
id = "rumdl"
name = "lint markdown files"
language = "system"
entry = "rumdl check ."
pass_filenames = false
priority = 100

[[repos.hooks]]
id = "zizmor"
name = "lint github actions by zizmor"
language = "system"
entry = "zizmor --persona=pedantic .github"
pass_filenames = false
priority = 100

[[repos.hooks]]
id = "commit-msg"
name = "check commit message"
language = "system"
entry = "sh ./scripts/commit-msg.sh"
stages = ["commit-msg"]
priority = 100

[[repos.hooks]]
id = "cocogitto"
name = "check conventional commits"
language = "system"
entry = "cog check origin/HEAD..HEAD"
pass_filenames = false
always_run = true
stages = ["post-commit", "pre-push"]
priority = 100
