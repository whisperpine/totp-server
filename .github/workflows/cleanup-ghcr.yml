name: Cleanup GHCR
on:
  workflow_dispatch:
  schedule:
    # Runs every Saturday at 05:15.
    - cron: "15 5 * * 6"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  delete-packages:
    name: delete container packages
    runs-on: ubuntu-latest
    permissions:
      packages: write # required to manage container images in GHCR
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Cleanup container images in ghcr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE_NAME: totp-server
          ORG_OR_USER: user
        run: bash ./scripts/cleanup-ghcr.sh
